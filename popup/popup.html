	<div class="buttons">
		<button id="screenshotBtn" class="tooltip" aria-label="Screenshot">

				xmlns:xlink="http://www.w3.org/1999/xlink">
				<title>screenshot</title>

							d="M106.666667,7.10542736e-15 L106.666667,64 L362.666667,64 L362.666667,320 L426.666667,320 L426.666667,362.666667 L362.666667,362.666667 L362.666667,426.666667 L320,426.666667 L320,362.666667 L64,362.666667 L64,7.10542736e-15 L106.666667,7.10542736e-15 Z M166.336,232.64 L106.666,296.422 L106.666667,320 L320,320 L320,308.725 L274.432,263.168 L235.659405,301.959634 L166.336,232.64 Z M320,106.666667 L106.666667,106.666667 L106.666,233.982 L165.332883,171.293333 L235.648,241.621333 L274.447284,202.831976 L320,248.385 L320,106.666667 Z M245.333333,128 C263.006445,128 277.333333,142.326888 277.333333,160 C277.333333,177.673112 263.006445,192 245.333333,192 C227.660221,192 213.333333,177.673112 213.333333,160 C213.333333,142.326888 227.660221,128 245.333333,128 Z M64,64 L64,106.666667 L7.10542736e-15,106.666667 L7.10542736e-15,64 L64,64 Z"

			<span class="tooltip-text">Screenshot</span>
		</button>

		<button id="recordBtn" class="tooltip" aria-label="Screen Record">
			<img src="/assets/screenrecord.svg" alt="Screen Record">
			<span class="tooltip-text">Screen Record</span>
		</button>

		<button id="historyBtn" class="tooltip" aria-label="Recording History">
			<svg width="26px" height="26px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M12 8V12L14.5 14.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M3.05 11A9 9 0 1 1 4 16.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M3 7V11H7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
			<span class="tooltip-text">History</span>
		</button>
	</div>
	<div class="settings">
		<div class="backbtn">
			<button id="gobackbtn">
				<svg width="15px" height="15px" viewBox="0 0 56.326 56.326" xmlns="http://www.w3.org/2000/svg">
					<path id="Path_14" data-name="Path 14"
						d="M477.613,422.087l25.6-25.6a1.5,1.5,0,0,0-2.122-2.121l-25.6,25.6-25.6-25.6a1.5,1.5,0,1,0-2.121,2.121l25.6,25.6-25.6,25.6a1.5,1.5,0,0,0,2.121,2.122l25.6-25.6,25.6,25.6a1.5,1.5,0,0,0,2.122-2.122Z"
						transform="translate(-447.328 -393.924)" />
				</svg>
			</button>
		</div>
		<div class="element">
			<p class="sethead">Appearance</p>
			<span class="uispan"><input type="radio" name="ui" id="system" checked>
				<label for="system">System&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></span>
			<span class="uispan"><input type="radio" name="ui" id="dark">
				<label for="dark">Dark Mode</label></span>
			<span class="uispan"><input type="radio" name="ui" id="light">
				<label for="light">Light Mode</label></span>
		</div>
		<div class="element second">
			<p class="sethead">Screenshot</p>
			<span class="uispan"><input type="checkbox" id="copyDirect">
				<label for="copyDirect">Copy Automatically</label></span>
			<span class="uispan"><input type="checkbox" id="downDirect">
				<label for="downDirect">Auto Download</label></span>
		</div>
		<div class="element second">
			<p class="sethead">Screen Record</p>
			<span class="uispan"><input type="checkbox" id="recordSystemAudio" checked>
				<label for="recordSystemAudio">System / Tab Audio</label></span>
			<span class="uispan"><input type="checkbox" id="recordMic">
				<label for="recordMic">Microphone</label></span>
			<span class="uispan uispan-row">
				<label for="videoQuality">Video Quality&nbsp;</label>
				<select id="videoQuality" class="settings-select">
					<option value="low">Low</option>
					<option value="medium" selected>Medium</option>
					<option value="high">High</option>
				</select>
			</span>
			<span class="uispan uispan-row">
				<label for="videoFps">FPS&nbsp;</label>
				<select id="videoFps" class="settings-select">
					<option value="30" selected>30 FPS</option>
					<option value="60">60 FPS</option>
				</select>
			</span>
		</div>
		<div class="footer">
			<p>Version 1.0.1</p>
			<a href="https://github.com/vinitpatil-8/quickshot-extension" target="_blank">Github</a>
		</div>
	</div>

	<script type="module" src="popup.js"></script>
</body>

</html>
