<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickShot</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header bar -->
  <header class="top">
    <div class="head">
      <div class="logo-wrap">
        <img width="26" height="26" src="/assets/icn.png" alt="QuickShot Logo">
      </div>
      <div class="brand-text">
        <span class="brand-title">QuickShot</span>
        <span class="qs-badge qs-badge-primary">Capture</span>
      </div>
    </div>
    <button id="settingsBtn" class="qs-btn qs-btn-ghost qs-btn-icon" title="Settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </header>

  <!-- Quick Action Cards -->
  <main class="buttons">
    <button id="screenshotBtn" class="action-card tooltip" aria-label="Screenshot">
      <div class="action-icon-wrap action-icon-blue">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <div class="action-text">
        <span class="action-title">Screenshot</span>
        <span class="action-subtitle">Capture active tab</span>
      </div>
      <span class="action-shortcut">Ctrl+Shift+S</span>
      <span class="tooltip-text">Capture Screenshot</span>
    </button>

    <button id="recordBtn" class="action-card tooltip" aria-label="Screen Record">
      <div class="action-icon-wrap action-icon-red">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </div>
      <div class="action-text">
        <span class="action-title">Screen Record</span>
        <span class="action-subtitle">Tab, Window, or Screen</span>
      </div>
      <span class="action-shortcut">Ctrl+Shift+R</span>
      <span class="tooltip-text">Start Screen Recording</span>
    </button>

    <button id="historyBtn" class="action-card tooltip" aria-label="Recording History">
      <div class="action-icon-wrap action-icon-purple">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div class="action-text">
        <span class="action-title">Recordings</span>
        <span class="action-subtitle">View past captures</span>
      </div>
      <span class="action-arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </span>
      <span class="tooltip-text">View Recordings</span>
    </button>
  </main>

  <!-- Settings View -->
  <section class="settings">
    <div class="settings-header">
      <button id="gobackbtn" class="qs-btn qs-btn-ghost qs-btn-icon backbtn" title="Back" aria-label="Back to main">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <h2 class="settings-title">Settings</h2>
    </div>

    <!-- Appearance Section -->
    <div class="element">
      <p class="sethead">Theme</p>
      <div class="theme-segmented">
        <label class="uispan theme-pill">
          <input type="radio" name="ui" id="system" checked>
          <span class="pill-label">System</span>
        </label>
        <label class="uispan theme-pill">
          <input type="radio" name="ui" id="dark">
          <span class="pill-label">Dark</span>
        </label>
        <label class="uispan theme-pill">
          <input type="radio" name="ui" id="light">
          <span class="pill-label">Light</span>
        </label>
      </div>
    </div>

    <!-- Screenshot Options -->
    <div class="element second">
      <p class="sethead">Screenshot Options</p>
      <div class="settings-group">
        <label class="uispan setting-row" for="copyDirect">
          <span class="setting-label">Copy Automatically</span>
          <input type="checkbox" id="copyDirect" class="qs-checkbox">
        </label>
        <label class="uispan setting-row" for="downDirect">
          <span class="setting-label">Auto Download</span>
          <input type="checkbox" id="downDirect" class="qs-checkbox">
        </label>
      </div>
    </div>

    <!-- Screen Record Options -->
    <div class="element second">
      <p class="sethead">Screen Recording</p>
      <div class="settings-group">
        <label class="uispan setting-row" for="recordSystemAudio">
          <span class="setting-label">System / Tab Audio</span>
          <input type="checkbox" id="recordSystemAudio" class="qs-checkbox" checked>
        </label>
        <label class="uispan setting-row" for="recordMic">
          <span class="setting-label">Microphone Audio</span>
          <input type="checkbox" id="recordMic" class="qs-checkbox">
        </label>
        <div class="uispan uispan-row setting-row">
          <label for="videoQuality" class="setting-label">Video Quality</label>
          <select id="videoQuality" class="settings-select qs-select">
            <option value="low">Low (1 Mbps)</option>
            <option value="medium" selected>Medium (2.5 Mbps)</option>
            <option value="high">High (6 Mbps)</option>
          </select>
        </div>
        <div class="uispan uispan-row setting-row">
          <label for="videoFps" class="setting-label">Frame Rate</label>
          <select id="videoFps" class="settings-select qs-select">
            <option value="30" selected>30 FPS</option>
            <option value="60">60 FPS</option>
          </select>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-version">QuickShot v1.0.1</span>
      <a href="https://github.com/vinitpatil-8/quickshot-extension" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub Repository</a>
    </footer>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
