<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QuickShot – Recording Preview</title>
    <style>
        :root {
            --bg: #0f0f11;
            --surface: #1a1a1f;
            --surface2: #22222a;
            --accent: #6c63ff;
            --accent2: #4fc3f7;
            --text: #f0f0f5;
            --text-muted: #888;
            --danger: #ef5350;
            --success: #43a047;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
        }

        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .header .badge {
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            letter-spacing: 0.05em;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            gap: 20px;
        }

        video {
            width: 100%;
            max-height: 65vh;
            background: #000;
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            display: block;
        }

        .meta-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .meta-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            word-break: break-all;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        button {
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
            font-family: inherit;
        }

        button:hover { opacity: 0.88; transform: translateY(-1px); }
        button:active { transform: translateY(0px); }

        .btn-download { background: var(--accent); color: #fff; box-shadow: 0 3px 12px rgba(108,99,255,0.3); }
        .btn-history { background: var(--surface2); color: var(--text); }
        .btn-discard { background: var(--danger); color: #fff; }

        .error-msg {
            display: none;
            background: #3b1515;
            border: 1px solid var(--danger);
            color: #ff8a80;
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>QuickShot</h1>
        <span class="badge">Preview</span>
    </div>
    <div class="container">
        <div id="error-msg" class="error-msg"></div>
        <video id="preview-video" controls autoplay></video>
        <div class="meta-card">
            <div class="meta-item"><span class="meta-label">Filename</span><span class="meta-value" id="meta-filename">—</span></div>
            <div class="meta-item"><span class="meta-label">Date</span><span class="meta-value" id="meta-date">—</span></div>
            <div class="meta-item"><span class="meta-label">Duration</span><span class="meta-value" id="meta-duration">—</span></div>
            <div class="meta-item"><span class="meta-label">File Size</span><span class="meta-value" id="meta-size">—</span></div>
            <div class="meta-item"><span class="meta-label">Type</span><span class="meta-value" id="meta-type">—</span></div>
            <div class="meta-item"><span class="meta-label">Audio</span><span class="meta-value" id="meta-audio">—</span></div>
        </div>
        <div class="controls">
            <button id="download-btn" class="btn-download">⬇ Download</button>
            <button id="history-btn" class="btn-history">📁 View History</button>
            <button id="discard-btn" class="btn-discard">🗑 Discard</button>
        </div>
    </div>
    <script src="preview.js"></script>
</body>
</html>
