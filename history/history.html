<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShot – Recording History</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <style>
        body {
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Header */
        .app-header {
            position: sticky;
            top: 0;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-brand .logo-wrap {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .app-header .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--foreground);
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .btn-new-rec {
            background: var(--primary);
            color: var(--primary-foreground);
            border: 1px solid var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .btn-new-rec:hover {
            background: var(--primary-hover);
        }

        /* Toolbar */
        .toolbar {
            padding: 14px 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-foreground);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            padding-left: 36px;
        }

        .toolbar select {
            min-width: 130px;
        }

        .count-badge {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted-foreground);
            font-weight: 600;
            white-space: nowrap;
            background: var(--secondary);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        /* Grid */
        .recordings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            padding: 24px 28px 48px;
            flex: 1;
        }

        /* Card */
        .recording-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .recording-card:hover {
            transform: translateY(-3px);
            border-color: var(--ring);
            box-shadow: var(--shadow-md);
        }

        .card-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb-placeholder {
            color: var(--muted-foreground);
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-filename {
            font-size: 14px;
            font-weight: 600;
            color: var(--foreground);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .type-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: var(--radius-full);
            border: 1px solid transparent;
        }

        .type-desktop {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.25);
        }
        .type-tab {
            background: rgba(14, 165, 233, 0.12);
            color: #0ea5e9;
            border-color: rgba(14, 165, 233, 0.25);
        }
        .type-window {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .meta-item {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-foreground);
            background: var(--secondary);
            border: 1px solid var(--border);
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-date {
            font-size: 11px;
            color: var(--muted-foreground);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid var(--border-subtle);
        }

        .card-btn {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--secondary);
            color: var(--foreground);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .card-btn:hover {
            background: var(--accent);
            border-color: var(--input);
        }

        .card-btn.btn-preview {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
            flex: 1.3;
        }
        .card-btn.btn-preview:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .card-btn.btn-delete:hover {
            background: var(--destructive-subtle);
            color: var(--destructive);
            border-color: var(--destructive-border);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-full);
            background: var(--secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted-foreground);
            margin-bottom: 4px;
        }

        .empty-state h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--foreground);
            letter-spacing: -0.01em;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--muted-foreground);
            max-width: 320px;
            line-height: 1.4;
        }

        .btn-start-recording {
            background: var(--primary);
            color: var(--primary-foreground);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-start-recording:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .app-header {
                padding: 10px 16px;
            }
            .toolbar {
                padding: 12px 16px;
                gap: 8px;
            }
            .recordings-grid {
                grid-template-columns: 1fr;
                padding: 16px 16px 36px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <div class="logo-wrap">
                <img src="/assets/icn.png" width="22" height="22" alt="QuickShot">
            </div>
            <span class="logo">QuickShot</span>
            <span class="qs-badge qs-badge-secondary page-title">History</span>
        </div>
        <div class="header-actions">
            <button class="qs-btn qs-btn-primary btn-new-rec" id="new-rec-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                New Recording
            </button>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
            <input type="text" id="search-input" class="qs-input" placeholder="Search recordings by filename...">
        </div>
        <select id="filter-type" class="qs-select">
            <option value="all">All Types</option>
            <option value="desktop">Screen</option>
            <option value="window">Window</option>
            <option value="tab">Tab</option>
        </select>
        <select id="sort-order" class="qs-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>
        <span class="count-badge" id="recording-count">—</span>
    </div>

    <main class="recordings-grid" id="recordings-grid">
        <div class="empty-state">
            <div class="empty-icon-wrap">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>
            <h2>Loading recordings...</h2>
        </div>
    </main>

    <script type="module" src="history.js"></script>
</body>
</html>
