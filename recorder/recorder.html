<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShot – Screen Recorder</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <style>
        body {
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .recorder-shell {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 32px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .recorder-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .recorder-logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background: var(--secondary);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .recorder-logo-badge img {
            display: block;
            border-radius: 4px;
        }

        .recorder-logo-badge span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--foreground);
        }

        .recorder-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--foreground);
        }

        .recorder-subtitle {
            font-size: 13px;
            color: var(--muted-foreground);
            max-width: 380px;
            line-height: 1.4;
        }

        /* Status & Alert banners */
        .status-box {
            background: var(--info-subtle);
            color: var(--info);
            border: 1px solid var(--info-border);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            word-break: break-word;
        }

        .warning-box {
            background: var(--warning-subtle);
            color: var(--warning);
            border: 1px solid var(--warning-border);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            word-break: break-word;
            text-align: left;
        }

        /* Start action button */
        .btn-start {
            width: 100%;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: var(--primary-foreground);
            border: 1px solid var(--primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        /* Recording In-Progress panel */
        .timer-card {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 44px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--foreground);
            letter-spacing: -0.02em;
        }

        .pulse-dot {
            width: 14px;
            height: 14px;
            background: var(--destructive);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-pause {
            flex: 1;
            min-width: 100px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius);
            background: var(--secondary);
            color: var(--foreground);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-pause:hover {
            background: var(--accent);
            border-color: var(--input);
        }

        .btn-stop {
            flex: 1.4;
            min-width: 120px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius);
            background: var(--destructive);
            color: var(--destructive-foreground);
            border: 1px solid var(--destructive);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-stop:hover {
            background: var(--destructive-hover);
        }

        .btn-cancel {
            flex: 1;
            min-width: 90px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius);
            background: transparent;
            color: var(--muted-foreground);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-cancel:hover {
            background: var(--accent);
            color: var(--foreground);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .recorder-shell {
                padding: 24px 16px;
            }
            .recorder-title {
                font-size: 19px;
            }
            .timer-display {
                font-size: 36px;
            }
            .controls {
                flex-direction: column;
            }
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="recorder-shell container">
        <header class="recorder-header">
            <div class="recorder-logo-badge">
                <img src="/assets/icn.png" width="22" height="22" alt="QuickShot">
                <span>QuickShot</span>
                <span class="qs-badge qs-badge-primary">Studio</span>
            </div>
            <h1 class="recorder-title">Screen Recorder</h1>
            <p class="recorder-subtitle subtitle">Select your target capture source to start recording your screen or window.</p>
        </header>

        <div id="warning-box" class="warning-box"></div>
        <div id="status-box" class="status-box">Ready to start capture</div>

        <button id="start-btn" class="btn-start" aria-label="Select Screen / Window / Tab to Record">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            Select Screen / Window / Tab to Record
        </button>

        <div id="recording-controls" class="hidden">
            <div class="timer-card">
                <div class="timer-display">
                    <span class="pulse-dot" id="recording-dot"></span>
                    <span id="timer-text">00:00</span>
                </div>
            </div>
            <div class="controls">
                <button id="pause-btn" class="btn-pause">Pause</button>
                <button id="stop-btn" class="btn-stop">Stop &amp; Save</button>
                <button id="cancel-btn" class="btn-cancel">Cancel</button>
            </div>
        </div>
    </main>

    <script type="module" src="recorder.js"></script>
</body>
</html>
