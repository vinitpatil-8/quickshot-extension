<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>QuickShot Recorder</title>
    <style>
        body {
            background-color: #181818;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #242424;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .status-box {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #2196F3;
            border: 1px solid rgba(33, 150, 243, 0.2);
            word-break: break-word;
        }

        .warning-box {
            background: rgba(255, 152, 0, 0.1);
            color: #ff9800;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            padding: 14px 28px;
            margin: 0 auto;
        }

        .btn-start:hover {
            background-color: #45a049;
        }

        .btn-pause {
            background-color: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background-color: #e68a00;
        }

        .btn-stop {
            background-color: #f44336;
            color: white;
        }

        .btn-stop:hover {
            background-color: #d32f2f;
        }

        .btn-cancel {
            background-color: #616161;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #424242;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #ff4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><img src="/assets/icn.png" width="32" height="32" alt="QuickShot"> QuickShot Screen Recorder</h1>
        <p class="subtitle">Select your target capture source to start recording</p>

        <div id="warning-box" class="warning-box"></div>
        <div id="status-box" class="status-box">Ready to start capture</div>

        <button id="start-btn" class="btn-start">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            Select Screen / Window / Tab to Record
        </button>

        <div id="recording-controls" class="hidden">
            <div class="timer-display">
                <span class="pulse-dot" id="recording-dot"></span>
                <span id="timer-text">00:00</span>
            </div>
            <div class="controls">
                <button id="pause-btn" class="btn-pause">Pause</button>
                <button id="stop-btn" class="btn-stop">Stop & Save</button>
                <button id="cancel-btn" class="btn-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="recorder.js"></script>
</body>
</html>
